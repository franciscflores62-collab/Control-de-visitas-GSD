<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formato de solicitud de visitas</title>
<style>
  :root{
    --navy:#0F2A4A;
    --navy-dark:#0A1D33;
    --blue:#1D63C9;
    --blue-light:#EAF2FC;
    --ink:#1A1F29;
    --muted:#6B7280;
    --line:#E3E7EE;
    --bg:#F4F6F9;
    --ok:#1B8354;
    --err:#C2402D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .topbar{
    background:linear-gradient(90deg,var(--navy) 0%,var(--navy-dark) 100%);
    color:#fff;
    padding:22px 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
  }
  .topbar .logo{
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .topbar .logo img{width:100%;height:100%;object-fit:contain;}
  .topbar h1{font-size:19px;font-weight:600;margin:0;letter-spacing:.2px;}
  .topbar p{margin:2px 0 0;font-size:12.5px;color:#B7C6DC;}

  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px;}

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:16px;
  }
  .card h2{
    font-size:13px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--blue);
    margin:0 0 16px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:14px 18px;
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  label{font-size:13px;font-weight:600;color:var(--ink);}
  label .req{color:var(--err);}
  input[type=text],input[type=date],input[type=number],select,textarea{
    border:1px solid #CBD3DE;
    border-radius:8px;
    padding:9px 11px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    width:100%;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(29,99,201,.15);
  }
  textarea{resize:vertical;min-height:64px;}
  .hint{font-size:11.5px;color:var(--muted);}

  .switch-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .switch{
    position:relative;width:42px;height:24px;flex-shrink:0;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider-toggle{
    position:absolute;cursor:pointer;inset:0;
    background:#CBD3DE;border-radius:999px;transition:.15s;
  }
  .slider-toggle:before{
    content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.15s;
  }
  .switch input:checked + .slider-toggle{background:var(--blue);}
  .switch input:checked + .slider-toggle:before{transform:translateX(18px);}

  #vehiculoFields{display:none;}
  #vehiculoFields.show{display:grid;}

  .slider-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  input[type=range]{flex:1;accent-color:var(--blue);}
  .slider-count{
    font-size:20px;font-weight:700;color:var(--blue);
    min-width:26px;text-align:center;
  }

  #visitantes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 18px;}

  .file-drop{
    border:1.5px dashed #CBD3DE;border-radius:8px;
    padding:16px;text-align:center;font-size:13px;color:var(--muted);
    cursor:pointer;
  }
  .file-drop:hover{border-color:var(--blue);color:var(--blue);}
  #fileList{margin-top:8px;font-size:12.5px;color:var(--ink);}

  .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  button{
    font-family:inherit;font-size:14px;font-weight:600;
    padding:11px 22px;border-radius:8px;border:1px solid #CBD3DE;
    background:#fff;color:var(--ink);cursor:pointer;
  }
  button.primary{
    background:var(--blue);border-color:var(--blue);color:#fff;
  }
  button.primary:hover{background:#1751A8;}
  button:disabled{opacity:.6;cursor:not-allowed;}

  #status{
    position:fixed;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0.96);
    max-width:420px;
    width:calc(100% - 48px);
    margin-top:0;
    padding:18px 20px;
    border-radius:12px;
    font-size:15px;
    font-weight:500;
    text-align:center;
    box-shadow:0 12px 32px rgba(15,42,74,.22);
    z-index:1000;
    display:none;
    opacity:0;
    transition:opacity .18s ease, transform .18s ease;
  }
  #status.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}
  #status-backdrop{
    position:fixed;inset:0;background:rgba(15,42,74,.28);
    z-index:999;display:none;
  }
  #status-backdrop.show{display:block;}
  #status.ok{background:#FFFFFF;color:var(--ok);border:1px solid #BEE3CF;}
  #status.err{background:#FFFFFF;color:var(--err);border:1px solid #F2C8BF;}

  .autocomplete{position:relative;}
  .ac-list{
    position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    max-height:180px;overflow-y:auto;box-shadow:0 6px 16px rgba(15,42,74,.12);
    display:none;
  }
  .ac-list.show{display:block;}
  .ac-item{padding:8px 11px;font-size:13.5px;cursor:pointer;}
  .ac-item:hover,.ac-item.active{background:var(--blue-light);}
  .ac-empty{padding:8px 11px;font-size:13px;color:var(--muted);}

  #fechaFinField{display:none;}
  #fechaFinField.show{display:flex;}

  .checkbox-group{
    display:flex;flex-wrap:wrap;gap:8px 10px;
    border:1px solid #CBD3DE;border-radius:8px;padding:10px 12px;
    min-height:44px;align-items:center;
  }
  .checkbox-group.error{border-color:var(--err);}
  .chk-item{
    display:flex;align-items:center;gap:6px;
    background:var(--blue-light);border-radius:6px;padding:5px 10px;
    font-size:13.5px;cursor:pointer;
  }
  .chk-item input{width:auto;margin:0;}

  @media (max-width:480px){
    .topbar{padding:16px;}
    .topbar h1{font-size:16px;}
    .card{padding:16px;}
    .actions{flex-direction:column-reverse;}
    .actions button{width:100%;}
  }
</style>
</head>

<div class="wrap">
  <form id="visitForm">

    <div class="card">
      <h2>Datos generales</h2>
      <div class="grid">
        <div class="field autocomplete">
          <label>Solicitante <span class="req">*</span></label>
          <input type="text" id="solicitanteInput" name="Solicitante" required placeholder="Escribe un nombre" autocomplete="off">
          <input type="hidden" id="solicitanteEmail" name="SolicitanteEmail">
          <div class="ac-list" id="solicitanteList"></div>
        </div>
        <div class="field autocomplete">

        </div>

          <label>Tipo de visita <span class="req">*</span></label>
          <select name="TipoVisita" id="tipoVisita" required>

            <option>Un día</option>
            <option>Múltiples días</option>
          </select>
        </div>
        <div class="field">
          <label>País <span class="req">*</span></label>

          </select>

          <label>Plantas <span class="req">*</span></label>
          <select name="Plantas" id="plantasSelect" required disabled>
            <option value="">Primero selecciona un país</option>
          </select>
        </div>
        <div class="field">
          <label>Portón de acceso <span class="req">*</span></label>
          <select name="PortonAcceso" id="portonSelect" required disabled>
            <option value="">Cargando opciones...</option>
          </select>
        </div>
        <div class="field">
          <label>Nombre de contratista/proveedor <span class="req">*</span></label>
          <input type="text" name="Contratista" required placeholder="Empresa o persona">
        </div>
        <div class="field">
          <label>Fecha de ingreso <span class="req">*</span></label>
          <input type="date" name="FechaIngreso" id="fechaIngreso" required>
        </div>
        <div class="field" id="fechaFinField">
          <label>Fecha de finalización</label>
          <input type="date" name="FechaFin" id="fechaFin">
          <span class="hint" id="fechaFinHint">Máximo 20 días calendario después del ingreso.</span>
        </div>
        <div class="field full">
          <label>Razón de visita <span class="req">*</span></label>
          <textarea name="RazonVisita" required placeholder="Describe el motivo de la visita"></textarea>
        </div>
        <div class="field full">
          <label>Datos adjuntos</label>
          <div class="file-drop" id="fileDrop">Adjuntar archivos</div>
          <input type="file" id="fileInput" multiple style="display:none">
          <div id="fileList">No hay nada adjunto.</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Vehículo</h2>
      <div class="switch-row">
        <label class="switch">
          <input type="checkbox" id="vehToggle">
          <span class="slider-toggle"></span>
        </label>
        <label style="font-weight:400;">¿Ingresará vehículo?</label>
      </div>
      <div class="grid" id="vehiculoFields">
        <div class="field">
          <label>Marca</label>
          <input type="text" name="VehiculoMarca" placeholder="Toyota">
        </div>
        <div class="field">
          <label>Placa</label>
          <input type="text" name="VehiculoPlaca" placeholder="ABC-123">
        </div>
        <div class="field">
          <label>Color</label>
          <input type="text" name="VehiculoColor" placeholder="Blanco">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Datos de visitantes</h2>
      <div class="slider-row">
        <label style="font-weight:400;white-space:nowrap;">Cantidad de visitantes</label>
        <input type="range" id="visitCount" min="1" max="10" value="1">
        <span class="slider-count" id="visitCountOut">1</span>
      </div>
      <div id="visitantes"></div>
    </div>

    <div class="actions">
      <button type="button" id="cancelBtn">Cancelar</button>
      <button type="submit" class="primary" id="submitBtn">Enviar solicitud</button>
    </div>

    <div id="status-backdrop"></div>
    <div id="status"></div>
  </form>
</div>

<script>
  // ── 0a. Cargar configuración (País / Plantas / Portón) en vivo ──
  // *** Reemplaza esta URL por la URL del flujo "Obtener configuración del formulario" ***
  const CONFIG_FLOW_URL = 'https://default1aaf0fd99e8b4375a2a450e7a07b39.51.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/03/workflows/c98a597ed9894ed78f7e18e9e6423049/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=xrEoDZFUV3ks58WNTrdmTKw926rOC-ie53VoclRWRmc';

  const paisSelect = document.getElementById('paisSelect');
  const plantasSelect = document.getElementById('plantasSelect');
  const portonSelect = document.getElementById('portonSelect');
  let PLANTAS_POR_PAIS = {};
  let PORTONES_POR_PLANTA = {};

  async function cargarConfiguracion(){
    try {
      const res = await fetch(CONFIG_FLOW_URL, { method: 'POST' });
      const rows = await res.json(); // [{Tipo, Pais, Planta, Valor}, ...]

      const paises = rows.filter(r => r.Tipo === 'Pais').map(r => r.Valor);
      PLANTAS_POR_PAIS = {};
      rows.filter(r => r.Tipo === 'Planta').forEach(r => {
        if (!PLANTAS_POR_PAIS[r.Pais]) PLANTAS_POR_PAIS[r.Pais] = [];
        PLANTAS_POR_PAIS[r.Pais].push(r.Valor);
      });
      PORTONES_POR_PLANTA = {};
      rows.filter(r => r.Tipo === 'Porton').forEach(r => {
        if (!PORTONES_POR_PLANTA[r.Planta]) PORTONES_POR_PLANTA[r.Planta] = [];
        PORTONES_POR_PLANTA[r.Planta].push(r.Valor);
      });

      paisSelect.innerHTML = '<option value="">Selecciona una opción</option>' +
        paises.map(p => `<option>${p}</option>`).join('');
      paisSelect.disabled = false;
      portonSelect.innerHTML = '<option value="">Primero selecciona una planta</option>';
    } catch (err) {
      paisSelect.innerHTML = '<option value="">No se pudo cargar. Recarga la página.</option>';
      portonSelect.innerHTML = '<option value="">No se pudo cargar. Recarga la página.</option>';
    }
  }
  cargarConfiguracion();

  paisSelect.addEventListener('change', () => {
    const plantas = PLANTAS_POR_PAIS[paisSelect.value];
    portonSelect.disabled = true;
    portonSelect.innerHTML = '<option value="">Primero selecciona una planta</option>';
    if (!plantas){
      plantasSelect.disabled = true;
      plantasSelect.innerHTML = '<option value="">Primero selecciona un país</option>';
      return;
    }
    plantasSelect.disabled = false;
    plantasSelect.innerHTML = '<option value="">Selecciona una opción</option>' +
      plantas.map(p => `<option>${p}</option>`).join('');
  });

  plantasSelect.addEventListener('change', () => {
    const portones = PORTONES_POR_PLANTA[plantasSelect.value];
    if (!portones){
      portonSelect.disabled = true;
      portonSelect.innerHTML = '<option value="">Sin portones asignados a esta planta</option>';
      return;
    }
    portonSelect.disabled = false;
    portonSelect.innerHTML = '<option value="">Selecciona una opción</option>' +
      portones.map(p => `<option>${p}</option>`).join('');
  });

  // ── 0b. Tipo de visita → mostrar y limitar fecha de finalización ──
  const tipoVisita = document.getElementById('tipoVisita');
  const fechaFinField = document.getElementById('fechaFinField');
  const fechaIngreso = document.getElementById('fechaIngreso');
  const fechaFin = document.getElementById('fechaFin');
  const fechaFinHint = document.getElementById('fechaFinHint');
  const MAX_DIAS_VISITA = 20;

  function actualizarLimiteFechaFin(){
    if (!fechaIngreso.value){
      fechaFin.removeAttribute('min');
      fechaFin.removeAttribute('max');
      return;
    }
    const ingreso = new Date(fechaIngreso.value + 'T00:00:00');
    const maxFecha = new Date(ingreso);
    maxFecha.setDate(maxFecha.getDate() + MAX_DIAS_VISITA);

    const toISO = (d) => d.toISOString().split('T')[0];
    fechaFin.min = fechaIngreso.value;
    fechaFin.max = toISO(maxFecha);
    fechaFinHint.textContent = `Máximo ${MAX_DIAS_VISITA} días calendario después del ingreso (hasta ${toISO(maxFecha)}).`;

    // Si la fecha ya elegida quedó fuera del nuevo rango, se limpia
    if (fechaFin.value && (fechaFin.value < fechaFin.min || fechaFin.value > fechaFin.max)){
      fechaFin.value = '';
    }
  }

  tipoVisita.addEventListener('change', () => {
    const esMultiple = tipoVisita.value === 'Múltiples días';
    fechaFinField.classList.toggle('show', esMultiple);
    if (esMultiple) actualizarLimiteFechaFin();
  });
  fechaIngreso.addEventListener('change', actualizarLimiteFechaFin);

  // ── 0c. Autocompletado Solicitante / Gerente ─────────
  // *** Reemplaza esta URL por la URL del flujo de búsqueda de usuarios ***
  const SEARCH_FLOW_URL = 'https://default1aaf0fd99e8b4375a2a450e7a07b39.51.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/20/workflows/e400db05ab6b43e0aeeaf1c3aa553e41/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=AO6AO5Jq_mLJkDVt98HG5zB9JRR17KcYqNwGK-Abpnk';

  function setupAutocomplete(inputId, listId, emailFieldId){
    const input = document.getElementById(inputId);
    const list = document.getElementById(listId);
    const emailField = document.getElementById(emailFieldId);
    let debounceTimer;

    input.addEventListener('input', () => {
      emailField.value = ''; // si el usuario sigue escribiendo, invalida la selección previa
      clearTimeout(debounceTimer);
      const term = input.value.trim();
      if (term.length < 2){
        list.classList.remove('show');
        return;
      }
      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch(SEARCH_FLOW_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ searchTerm: term })
          });
          const users = await res.json();
          renderSuggestions(users, list, input, emailField);
        } catch (err) {
          list.innerHTML = '<div class="ac-empty">No se pudo buscar. Verifica la conexión.</div>';
          list.classList.add('show');
        }
      }, 300);
    });

    document.addEventListener('click', (e) => {
      if (!input.contains(e.target) && !list.contains(e.target)){
        list.classList.remove('show');
      }
    });
  }

  function renderSuggestions(users, list, input, emailField){
    if (!users || users.length === 0){
      list.innerHTML = '<div class="ac-empty">Sin resultados</div>';
      list.classList.add('show');
      return;
    }
    list.innerHTML = users.map(u =>
      `<div class="ac-item" data-name="${u.displayName || u.DisplayName || ''}" data-email="${u.mail || u.Mail || ''}">
        ${u.displayName || u.DisplayName || ''} <span style="color:var(--muted);">${u.mail || u.Mail || ''}</span>
      </div>`
    ).join('');
    list.classList.add('show');
    list.querySelectorAll('.ac-item').forEach(item => {
      item.addEventListener('click', () => {
        input.value = item.dataset.name;
        emailField.value = item.dataset.email;
        list.classList.remove('show');
      });
    });
  }

  setupAutocomplete('solicitanteInput', 'solicitanteList', 'solicitanteEmail');
  setupAutocomplete('gerenteInput', 'gerenteList', 'gerenteEmail');

  // ── 1. Vehículo toggle ──────────────────────────────
  const vehToggle = document.getElementById('vehToggle');
  const vehFields = document.getElementById('vehiculoFields');
  vehToggle.addEventListener('change', () => {
    vehFields.classList.toggle('show', vehToggle.checked);
  });

  // ── 2. Visitantes dinámicos ──────────────────────────
  const visitCount = document.getElementById('visitCount');
  const visitCountOut = document.getElementById('visitCountOut');
  const visitantes = document.getElementById('visitantes');

  function renderVisitantes(n){
    visitantes.innerHTML = '';
    for (let i = 1; i <= n; i++){
      const nameField = document.createElement('div');
      nameField.className = 'field';
      nameField.innerHTML = `<label>${i}. Nombre de visitante ${i<=1?'<span class="req">*</span>':''}</label>
        <input type="text" name="VisitanteNombre_${i}" ${i<=1?'required':''} placeholder="Nombre completo">`;
      const idField = document.createElement('div');
      idField.className = 'field';
      idField.innerHTML = `<label>${i}. Identidad ${i<=1?'<span class="req">*</span>':''}</label>
        <input type="text" name="VisitanteIdentidad_${i}" ${i<=1?'required':''} placeholder="Cédula">`;
      visitantes.appendChild(nameField);
      visitantes.appendChild(idField);
    }
  }
  visitCount.addEventListener('input', () => {
    visitCountOut.textContent = visitCount.value;
    renderVisitantes(parseInt(visitCount.value));
  });
  renderVisitantes(1);

  // ── 3. Adjuntos (solo referencia visual; ver nota abajo) ──
  const fileDrop = document.getElementById('fileDrop');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  fileDrop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length === 0){
      fileList.textContent = 'No hay nada adjunto.';
    } else {
      fileList.textContent = Array.from(fileInput.files).map(f => f.name).join(', ');
    }
  });

  // ── 4. Envío a Power Automate ────────────────────────
  // *** Reemplaza esta URL por la URL HTTP POST que genera tu flujo ***
  const FLOW_URL = 'https://default1aaf0fd99e8b4375a2a450e7a07b39.51.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/05/workflows/a2bf8812b6a540148e6db7217c84d3ed/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=pexmOWX02p8-8f2blKMPWsLEUtDdmu5ypSOtm6G7iBA';

  const form = document.getElementById('visitForm');
  const statusBox = document.getElementById('status');
  const statusBackdrop = document.getElementById('status-backdrop');
  const submitBtn = document.getElementById('submitBtn');

  function showStatus(type, message, autoHideMs){
    statusBox.className = type;
    statusBox.textContent = message;
    statusBox.classList.add('show');
    statusBackdrop.classList.add('show');
    if (autoHideMs){
      clearTimeout(showStatus._t);
      showStatus._t = setTimeout(hideStatus, autoHideMs);
    }
  }
  function hideStatus(){
    statusBox.classList.remove('show');
    statusBackdrop.classList.remove('show');
  }
  statusBackdrop.addEventListener('click', hideStatus);

  document.getElementById('cancelBtn').addEventListener('click', () => form.reset());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideStatus();

    const solicitanteEmail = document.getElementById('solicitanteEmail');
    const gerenteEmail = document.getElementById('gerenteEmail');
    if (!solicitanteEmail.value){
      showStatus('err', 'Selecciona al Solicitante de la lista de sugerencias.', 3500);
      document.getElementById('solicitanteInput').focus();
      return;
    }
    if (!gerenteEmail.value){
      showStatus('err', 'Selecciona al Gerente (aprobador) de la lista de sugerencias.', 3500);
      document.getElementById('gerenteInput').focus();
      return;
    }

    if (tipoVisita.value === 'Múltiples días'){
      if (!fechaFin.value){
        showStatus('err', 'Ingresa la fecha de finalización.', 3000);
        fechaFin.focus();
        return;
      }
      const dias = (new Date(fechaFin.value) - new Date(fechaIngreso.value)) / 86400000;
      if (dias < 0 || dias > MAX_DIAS_VISITA){
        showStatus('err', `La fecha de finalización debe estar dentro de ${MAX_DIAS_VISITA} días calendario después del ingreso.`, 4000);
        fechaFin.focus();
        return;
      }
    }

    const fd = new FormData(form);
    const payload = {};
    fd.forEach((value, key) => {
      payload[key] = value;
    });
    // Solo la fecha de finalización necesita null cuando está vacía
    // (SharePoint rechaza "" en columnas de tipo Fecha, pero el trigger
    // rechaza null en columnas de texto — así que cada tipo necesita lo suyo)
    if (payload['FechaFin'] === '') payload['FechaFin'] = null;
    payload['IngresaraVehiculo'] = vehToggle.checked;
    payload['CantidadVisitantes'] = parseInt(visitCount.value);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';

    try {
      const res = await fetch(FLOW_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Respuesta ' + res.status);
      showStatus('ok', 'Solicitud enviada correctamente.', 4000);
      form.reset();
      vehFields.classList.remove('show');
      renderVisitantes(1);
      visitCount.value = 1;
      visitCountOut.textContent = 1;
      fileList.textContent = 'No hay nada adjunto.';
      plantasSelect.disabled = true;
      plantasSelect.innerHTML = '<option value="">Primero selecciona un país</option>';
      portonSelect.disabled = true;
      portonSelect.innerHTML = '<option value="">Primero selecciona una planta</option>';
      fechaFinField.classList.remove('show');
    } catch (err) {
      showStatus('err', 'No se pudo enviar la solicitud. Verifica tu conexión e inténtalo de nuevo.', 4000);
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar solicitud';
    }
  });
</script>

</body>
</html>
